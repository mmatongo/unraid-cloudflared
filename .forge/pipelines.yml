version: 1

# Example pipelines. `smoke` is repository-agnostic and should pass anywhere;
# adapt `test` to your project's toolchain.
pipelines:
  - name: smoke
    on: [push]
    image: alpine:3.21
    steps:
      - name: checkout-contents
        run: |
          echo "workspace contents:"
          ls -la
          test -n "$(ls -A)" && echo "OK: commit exported into the workspace"

  # Adapt to your stack. `network: true` is required to fetch dependencies.
  # Go:     image golang:1.23   -> go build ./... / go test ./...
  # Python: image python:3.10 -> pip install -r requirements.txt / pytest
  # Node:   image node:22       -> npm ci / npm test
  - name: test
    on: [push, pull_request]
    image: python:3.10
    network: true
    steps:
      - name: build
        run: |
          python --version
          test -f requirements.txt && pip install -r requirements.txt || echo "no requirements.txt, skipping"
