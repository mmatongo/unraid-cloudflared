version: 1

pipelines:
  # A tiny pipeline that proves the runner works, with no network and no
  # large image pull. Start here.
  - name: smoke
    on: [push]
    image: alpine:3.21
    steps:
      - name: checkout-contents
        run: |
          echo "workspace contents:"
          ls -la
          test -f go.mod && echo "OK: repo exported at the pushed commit"

  # Build and test the project itself.
  - name: test
    on: [push, pull_request]
    image: golang:1.23
    network: true          # needed to fetch Go modules
    steps:
      - name: build
        run:
          - go build ./...
      - name: test
        run:
          - go test ./... -count=1
